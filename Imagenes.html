<!DOCTYPE html><!--Define el documento como html-->
<html lang="en"><!--es el lenguaje estándar utilizado para estructurar-->
<head><!--Encabezado-->
    <meta charset="UTF-8"><!--Sirve para mostrar caracteres variados-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--Sirve para mostrar la pagina en celulares-->
    <title>Imagenes en HTML</title><!--sirve para hacer que una página web sea responsiva-->
</head><!--Cierra en cabezado-->
<body><!--El cuerpo de la página-->
    <h2>Imagenes en HTML</h2><!--El titulo mas pequeño que el h1-->
    <h3>Locales</h3>
    <img src="caritas.png" alt="Imagen de carita feliz"> <!--img sirve para insertar con una imagen, alt muentra el texto de lo que aparece en caso de fallas la imagen -->
    <h3>Locales redismensionado</h3>
    <img src="imagenes/carita.png" alt="" width="200" height="100"><!--Modifica el tamaño de la imagen-->
    <h3>Desde internet</h3>
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt=""><!--img sirve para insertar con una imagen con un link,y la imagen se abre en internet pero insertandola en mi pagina-->
    <h3>Animaciones</h3>
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt=""><!--sirve para insertar con un gif con un link,y la imagen se abre en internet pero insertandola en mi pagina-->
</body><!--Cierra el cuerpo de la pagina-->
</html><!--Cierra lo que se ve en pantalla-->
